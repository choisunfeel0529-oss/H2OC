<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>폐기물 선택 - H2OC 계산기</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell" id="select-screen">
  <a href="/login" class="back-btn" aria-label="뒤로가기">←</a>
  <a href="/" class="home-btn" aria-label="메인으로">⌂</a>

  <div class="step-indicator heading-font">2 / 3</div>
  <h1 class="page-title heading-font">계산할 폐기물을<br>선택해 주세요!</h1>

  <div class="waste-grid" id="waste-grid">
    <p class="loading-msg">불러오는 중...</p>
  </div>

  <div style="margin-top:auto; padding-top: 24px;">
    <button type="button" class="btn-primary" id="next-btn" disabled>다음으로</button>
  </div>
</div>

<script src="/static/data.js"></script>
<script>
(function () {
  const nickname = sessionStorage.getItem(SS_NICKNAME);
  if (!nickname) {
    window.location.href = '/login';
    return;
  }

  const grid = document.getElementById('waste-grid');
  const nextBtn = document.getElementById('next-btn');
  let selectedCode = sessionStorage.getItem(SS_WASTE_CODE) || null;
  let wasteTypes = [];

  function render() {
    if (!wasteTypes.length) {
      grid.innerHTML = '<p class="empty-msg">등록된 계산 데이터가 없습니다.<br>관리자에게 문의해주세요.</p>';
      nextBtn.disabled = true;
      return;
    }
    grid.innerHTML = wasteTypes.map(function (w) {
      const selected = w.code === selectedCode ? ' selected' : '';
      return '<button type="button" class="waste-card' + selected + '" data-code="' + w.code + '">' + escapeHtml(w.item_name) + '</button>';
    }).join('');
    nextBtn.disabled = !selectedCode;
  }

  grid.addEventListener('click', function (e) {
    const btn = e.target.closest('.waste-card');
    if (!btn) return;
    selectedCode = btn.getAttribute('data-code');
    render();
  });

  nextBtn.addEventListener('click', function () {
    if (!selectedCode) return;
    sessionStorage.setItem(SS_WASTE_CODE, selectedCode);
    window.location.href = '/weight';
  });

  (async function init() {
    wasteTypes = await fetchWasteTypes();
    render();
  })();
})();
</script>
</body>
</html>
