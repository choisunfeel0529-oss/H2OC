<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>폐기물 선택 - H2OC 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell" id="select-screen">
  <a href="/login" class="back-btn" aria-label="뒤로가기">←</a>

  <div class="step-indicator heading-font">2 / 3</div>
  <h1 class="page-title heading-font">어떤 폐기물을<br>분리배출 하셨나요?</h1>

  <div class="waste-grid" id="waste-grid"></div>

  <div style="margin-top:auto; padding-top: 24px;">
    <button type="button" class="btn-primary" id="next-btn" disabled>다음으로</button>
  </div>
</div>

<script src="/static/data.js"></script>
<script>
(function () {
  const nickname = sessionStorage.getItem(SS_NICKNAME);
  if (!nickname) {
    window.location.href = '/login';
    return;
  }

  const grid = document.getElementById('waste-grid');
  const nextBtn = document.getElementById('next-btn');
  let selectedCode = sessionStorage.getItem(SS_WASTE_CODE) || null;

  function render() {
    grid.innerHTML = WASTE_TYPES.map(function (w) {
      const selected = w.code === selectedCode ? ' selected' : '';
      return '<button type="button" class="waste-card' + selected + '" data-code="' + w.code + '">' + escapeHtml(w.short) + '</button>';
    }).join('');
    nextBtn.disabled = !selectedCode;
  }

  grid.addEventListener('click', function (e) {
    const btn = e.target.closest('.waste-card');
    if (!btn) return;
    selectedCode = btn.getAttribute('data-code');
    render();
  });

  nextBtn.addEventListener('click', function () {
    if (!selectedCode) return;
    sessionStorage.setItem(SS_WASTE_CODE, selectedCode);
    window.location.href = '/weight';
  });

  render();
})();
</script>
</body>
</html>
