<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>H2OC 에이치투오씨 계산기</title>
<meta name="description" content="플라스틱, 종이, 캔 등 폐기물 분리배출로 절감되는 탄소와 수자원을 계산해보세요.">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell" id="home-screen">

  <div class="logo-wrap">
    <img class="logo-badge-img" src="/static/images/logo-badge.png" alt="H2OC 에이치투오씨 계산기">
    <img class="project-logo-img" src="/static/images/project-logo.png" alt="프로젝트 環生">
  </div>

  <nav class="home-menu" aria-label="메인 메뉴">
    <a href="/login" class="btn-white" id="go-calculator">
      <span class="menu-title">계산하러<br>가기</span>
      <span class="menu-icon-img" role="img" aria-label="사칙연산"></span>
    </a>
    <a href="/ranking" class="btn-white" id="go-ranking">
      <span class="menu-title">내 랭킹<br>보러 가기</span>
      <span class="menu-icon-img rank" role="img" aria-label="랭킹"></span>
    </a>
    <a href="/status" class="btn-white" id="go-status">
      <span class="menu-title">전체 참여<br>현황 보러 가기</span>
      <span class="menu-icon-img people" role="img" aria-label="전체 참여 현황"></span>
    </a>
  </nav>

  <p class="footer-link">
    <a href="/admin">관리자 모드</a>
  </p>
</div>

<script src="/static/data.js"></script>
</body>
</html>
