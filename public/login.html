<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>닉네임 입력 - H2OC 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell" id="login-screen" style="display:none;">
  <a href="/" class="back-btn" aria-label="뒤로가기">←</a>

  <div class="step-indicator heading-font">1 / 3</div>
  <h1 class="page-title heading-font">먼저,<br>닉네임을 알려주세요</h1>

  <form id="login-form" autocomplete="off">
    <input type="text" id="nickname-input" class="input-pill" placeholder="닉네임을 입력해주세요 (최대 20자)" maxlength="20" required>
    <p class="error-text" id="error-msg" style="display:none;"></p>
  </form>

  <div style="margin-top:auto;">
    <button type="submit" form="login-form" class="btn-primary" id="next-btn">다음으로</button>
  </div>
</div>

<div class="app-shell" id="loading-screen">
  <p class="loading-msg" style="margin-top:50vh; text-align:center;">확인 중...</p>
</div>

<script src="/static/data.js"></script>
<script>
(function () {
  const loginScreen = document.getElementById('login-screen');
  const loadingScreen = document.getElementById('loading-screen');
  const form = document.getElementById('login-form');
  const input = document.getElementById('nickname-input');
  const errorMsg = document.getElementById('error-msg');
  const nextBtn = document.getElementById('next-btn');

  function showLogin() {
    loadingScreen.style.display = 'none';
    loginScreen.style.display = '';
  }

  // 요청 4: 같은 디바이스에서 재접속하는 경우, 기존 닉네임을 그대로 사용할 수 있도록
  // 서버에 저장된 device_id 기준 닉네임을 조회해 자동으로 다음 단계로 진행한다.
  (async function checkDeviceReuse() {
    try {
      const deviceNickname = await fetchDeviceNickname();
      if (deviceNickname) {
        sessionStorage.setItem(SS_NICKNAME, deviceNickname);
        localStorage.setItem(LS_LAST_NICKNAME, deviceNickname);
        window.location.href = '/select';
        return;
      }
    } catch (e) {
      console.error(e);
    }
    // 재사용할 닉네임이 없으면 입력창 표시 (이전 입력값 편의상 자동 채움)
    const lastNickname = localStorage.getItem(LS_LAST_NICKNAME);
    if (lastNickname) input.value = lastNickname;
    showLogin();
  })();

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }
  function clearError() {
    errorMsg.style.display = 'none';
    errorMsg.textContent = '';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearError();
    const nickname = input.value.trim();

    if (!nickname) {
      showError('닉네임을 입력해주세요.');
      return;
    }
    if (nickname.length > 20) {
      showError('닉네임은 20자 이내로 입력해주세요.');
      return;
    }

    nextBtn.disabled = true;
    nextBtn.textContent = '확인 중...';

    try {
      const taken = await isNicknameTaken(nickname);
      if (taken) {
        showError('이미 사용 중인 닉네임입니다. 다른 닉네임을 입력해주세요.');
        nextBtn.disabled = false;
        nextBtn.textContent = '다음으로';
        return;
      }
      sessionStorage.setItem(SS_NICKNAME, nickname);
      localStorage.setItem(LS_LAST_NICKNAME, nickname);
      window.location.href = '/select';
    } catch (err) {
      console.error(err);
      showError('닉네임 확인 중 오류가 발생했습니다. 다시 시도해주세요.');
      nextBtn.disabled = false;
      nextBtn.textContent = '다음으로';
    }
  });
})();
</script>
</body>
</html>
