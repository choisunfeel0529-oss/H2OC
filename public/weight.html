<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>무게 입력 - H2OC 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell" id="weight-screen">
  <a href="/select" class="back-btn" aria-label="뒤로가기">←</a>

  <div class="step-indicator heading-font">3 / 3</div>
  <h1 class="page-title heading-font" id="page-title">분리배출한<br>무게를 입력해주세요</h1>

  <form id="weight-form" autocomplete="off">
    <div class="input-with-unit">
      <input type="number" id="weight-input" class="input-pill" placeholder="예) 500" min="1" step="1" inputmode="numeric" required>
      <span class="unit-label">g</span>
    </div>
    <p class="error-text" id="error-msg" style="display:none;"></p>
  </form>

  <div style="margin-top:auto;">
    <button type="submit" form="weight-form" class="btn-primary" id="submit-btn">계산하기</button>
  </div>
</div>

<script src="/static/data.js"></script>
<script>
(function () {
  const nickname = sessionStorage.getItem(SS_NICKNAME);
  const wasteCode = sessionStorage.getItem(SS_WASTE_CODE);
  if (!nickname) { window.location.href = '/login'; return; }
  if (!wasteCode) { window.location.href = '/select'; return; }

  const wasteType = getWasteType(wasteCode);
  const pageTitle = document.getElementById('page-title');
  if (wasteType) {
    pageTitle.innerHTML = escapeHtml(wasteType.short) + ',<br>분리배출한 무게를<br>입력해주세요';
  }

  const form = document.getElementById('weight-form');
  const input = document.getElementById('weight-input');
  const errorMsg = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }
  function clearError() {
    errorMsg.style.display = 'none';
    errorMsg.textContent = '';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearError();
    const weightG = Number(input.value);

    if (!input.value || !Number.isFinite(weightG) || weightG <= 0) {
      showError('무게는 0보다 큰 숫자로 입력해주세요.');
      return;
    }
    if (weightG > 1000000) {
      showError('무게 값이 너무 큽니다. 다시 확인해주세요.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '계산 중...';

    try {
      const saved = await createSubmission({
        nickname: nickname,
        waste_type: wasteCode,
        weight_g: weightG
      });
      sessionStorage.setItem(SS_RESULT, JSON.stringify(saved));
      window.location.href = '/result';
    } catch (err) {
      console.error(err);
      if (err.status === 409) {
        showError('닉네임이 이미 사용되었습니다. 처음으로 돌아가 다시 시도해주세요.');
      } else {
        showError(err.message || '저장 중 오류가 발생했습니다. 다시 시도해주세요.');
      }
      submitBtn.disabled = false;
      submitBtn.textContent = '계산하기';
    }
  });
})();
</script>
</body>
</html>
