<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>결과 - H2OC 계산기</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell" id="result-screen">
  <a href="/" class="back-btn" aria-label="처음으로">←</a>
  <a href="/" class="home-btn" aria-label="메인으로">⌂</a>

  <h1 class="result-title heading-font" id="result-title">축하해요!</h1>

  <div class="result-stats">
    <div class="stat-card">
      <div class="stat-label">🌱 탄소 저감량</div>
      <div class="stat-value" id="carbon-value">0</div>
      <div class="stat-unit">kg CO2eq</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">💧 수자원 절약률</div>
      <div class="stat-value" id="water-value">0</div>
      <div class="stat-unit" id="water-unit">%</div>
    </div>
  </div>

  <p class="result-desc" id="result-desc"></p>

  <div class="result-actions">
    <button type="button" class="btn-primary" id="share-btn">
      <span>스토리에 공유하기</span><span aria-hidden="true">↗</span>
    </button>
    <a href="/ranking" class="btn-primary" id="ranking-btn" style="background:#fff; color:var(--green); border:2px solid var(--green);">
      <span>내 랭킹 보러가기</span><span aria-hidden="true">&gt;</span>
    </a>
  </div>
</div>

<!-- ================================================================
     SNS 스토리(9:16) 공유용 결과 카드 (화면에는 보이지 않고 이미지 캡처용)
     ================================================================ -->
<div id="story-card-wrap">
  <div id="story-card">
    <img class="story-logo-badge" src="/static/images/logo-badge.png" alt="H2OC 에이치투오씨 계산기">

    <div class="story-nickname heading-font" id="story-nickname">닉네임님</div>

    <div class="story-label" id="story-label">닉네임님의 분리배출량</div>
    <div class="story-waste-box">
      <div class="story-waste-list" id="story-waste">품목 000g</div>
    </div>

    <div class="story-stats">
      <div class="story-stat">
        <div class="story-stat-label"><span class="story-stat-icon">🌱</span> 탄소 저감량</div>
        <div class="story-stat-value heading-font" id="story-carbon">0</div>
        <div class="story-stat-unit-line">kg CO2eq</div>
      </div>
      <div class="story-stat">
        <div class="story-stat-label"><span class="story-stat-icon">💧</span> 수자원 절약률</div>
        <div class="story-stat-value heading-font" id="story-water">0</div>
        <div class="story-stat-unit-line">%</div>
      </div>
    </div>

    <div class="story-footer">
      <div class="story-footer-brand heading-font">프로젝트 <span>環生</span></div>
      <div class="story-footer-handle">@project.hwansaeng</div>
    </div>
  </div>
</div>

<!-- 공유 미리보기 모달 -->
<div id="share-modal" class="share-modal" style="display:none;">
  <div class="share-modal-inner">
    <img id="share-preview-img" alt="공유 이미지 미리보기">
    <div class="share-modal-actions">
      <button type="button" class="btn-primary" id="share-download-btn">이미지 저장</button>
      <button type="button" class="btn-primary" id="share-native-btn" style="background:#fff; color:var(--green); border:2px solid var(--green); display:none;">공유하기</button>
      <button type="button" id="share-close-btn" class="footer-link" style="background:none; border:none; color:#9aa39a; text-decoration:underline; cursor:pointer; padding:10px;">닫기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="/static/data.js"></script>
<script>
(function () {
  const raw = sessionStorage.getItem(SS_RESULT);
  if (!raw) { window.location.href = '/'; return; }
  let parsed;
  try { parsed = JSON.parse(raw); } catch (e) { window.location.href = '/'; return; }

  // SS_RESULT 형식: { nickname, items: [ {waste_label, weight_g, carbon_kg, water_percent, water_label}, ... ] }
  // 폐기물 1개만 등록한 경우에도 items 배열에 항목 1개로 동일하게 담겨 기존과 동일한 계산/표시 결과를 보장한다.
  const nickname = parsed.nickname;
  const items = Array.isArray(parsed.items) ? parsed.items : [];
  if (!items.length) { window.location.href = '/'; return; }

  // ---- 전체 합산 계산 ----
  let totalCarbon = 0;
  let numericWaterSum = 0;
  let numericWaterCount = 0;
  const textLabels = [];

  items.forEach(function (item) {
    totalCarbon += Number(item.carbon_kg) || 0;
    const hasNumeric = item.water_percent !== null && item.water_percent !== undefined && !isNaN(Number(item.water_percent));
    if (hasNumeric) {
      numericWaterSum += Number(item.water_percent);
      numericWaterCount += 1;
    } else if (item.water_label) {
      textLabels.push(item.water_label);
    }
  });
  totalCarbon = Math.round(totalCarbon * 1000) / 1000;

  const hasNumericWater = numericWaterCount > 0;
  const waterDisplay = hasNumericWater
    ? Math.round(numericWaterSum / numericWaterCount)
    : (textLabels[0] || '-');
  const waterUnit = hasNumericWater ? '%' : '';

  // ---- 폐기물 목록 텍스트 (한 개면 "품목 000g", 여러 개면 줄바꿈으로 나열) ----
  const wasteListText = items.map(function (item) {
    return escapeHtml(item.waste_label) + ' ' + item.weight_g + 'g';
  }).join('\n');

  document.getElementById('result-title').textContent = escapeHtml(nickname) + '님, 멋져요!';
  document.getElementById('carbon-value').textContent = totalCarbon;
  document.getElementById('water-value').textContent = waterDisplay;
  document.getElementById('water-unit').textContent = waterUnit;

  const descPrefix = items.length === 1
    ? (escapeHtml(items[0].waste_label) + ' ' + items[0].weight_g + 'g을')
    : (wasteListText.replace(/\n/g, '<br>') + '<br>총');

  document.getElementById('result-desc').innerHTML =
    descPrefix + ' 분리배출해서<br>' +
    '<strong>' + totalCarbon + 'kg</strong>의 탄소를 줄이고<br>' +
    '<strong>' + waterDisplay + waterUnit + '</strong>의 수자원을 절약했어요!';

  // ---- 스토리 카드 내용 채우기 ----
  document.getElementById('story-nickname').textContent = nickname + '님';
  document.getElementById('story-label').textContent = nickname + '님의 분리배출량';
  document.getElementById('story-waste').textContent = wasteListText;
  document.getElementById('story-carbon').textContent = totalCarbon;
  document.getElementById('story-water').textContent = waterDisplay;

  const shareModal = document.getElementById('share-modal');
  const previewImg = document.getElementById('share-preview-img');
  const downloadBtn = document.getElementById('share-download-btn');
  const nativeBtn = document.getElementById('share-native-btn');
  const closeBtn = document.getElementById('share-close-btn');
  let lastBlob = null;

  function fileName() {
    return 'h2oc_' + nickname + '_' + new Date().toISOString().slice(0, 10) + '.png';
  }

  document.getElementById('share-btn').addEventListener('click', async function () {
    const btn = this;
    btn.disabled = true;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span>이미지 생성 중...</span>';

    // html2canvas가 border-radius + box-shadow 조합을 캡처할 때 모서리에
    // 체크무늬 아티팩트를 만드는 렌더링 버그가 있어, 캡처 순간에만 그림자를
    // 잠시 제거했다가 캡처 후 즉시 복원한다. (화면 디자인/레이아웃은 그대로 유지)
    const shadowBoxes = document.querySelectorAll('#story-card .story-waste-box, #story-card .story-stat');
    shadowBoxes.forEach(function (el) { el.classList.add('no-shadow-for-capture'); });

    try {
      const cardEl = document.getElementById('story-card');
      const canvas = await html2canvas(cardEl, {
        width: 1080,
        height: 1920,
        scale: 1,
        backgroundColor: '#f4f4f2',
        useCORS: true
      });

      canvas.toBlob(async function (blob) {
        if (!blob) {
          showToast('이미지 생성에 실패했습니다.');
          btn.disabled = false;
          btn.innerHTML = originalText;
          return;
        }
        lastBlob = blob;
        const url = URL.createObjectURL(blob);
        previewImg.src = url;
        shareModal.style.display = 'flex';

        // Web Share API Level 2 (파일 공유) 지원 시 네이티브 공유 버튼 노출
        const file = new File([blob], fileName(), { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          nativeBtn.style.display = '';
          nativeBtn.onclick = async function () {
            try {
              await navigator.share({
                files: [file],
                title: 'H2OC 계산기',
                text: nickname + '님의 분리배출 성과! 탄소 ' + totalCarbon + 'kg 절감 🌱'
              });
            } catch (e) { /* 사용자 취소 등 */ }
          };
        } else {
          nativeBtn.style.display = 'none';
        }

        btn.disabled = false;
        btn.innerHTML = originalText;
      }, 'image/png');
    } catch (err) {
      console.error(err);
      showToast('이미지 생성 중 오류가 발생했습니다.');
      btn.disabled = false;
      btn.innerHTML = originalText;
    } finally {
      shadowBoxes.forEach(function (el) { el.classList.remove('no-shadow-for-capture'); });
    }
  });

  downloadBtn.addEventListener('click', function () {
    if (!lastBlob) return;
    const url = URL.createObjectURL(lastBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    showToast('이미지가 저장되었습니다! 인스타그램 스토리에 업로드해보세요 🎉');
  });

  closeBtn.addEventListener('click', function () {
    shareModal.style.display = 'none';
  });
  shareModal.addEventListener('click', function (e) {
    if (e.target === shareModal) shareModal.style.display = 'none';
  });
})();
</script>
</body>
</html>
